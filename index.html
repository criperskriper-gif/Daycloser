<body>
<div id="app"></div>
<script>
(function(){
  'use strict';

  /* ============ CONSTANTS & UTILS ============ */
  const LS_KEY = 'daycloser_v1';
  const VERSION = 1;
  const MAX_TASKS = 7;

  const $ = (s, r) => (r||document).querySelector(s);

  function dstr(d) {
    d = d || new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function addDays(s, n) {
    const [y,m,d] = s.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    dt.setDate(dt.getDate() + n);
    return dstr(dt);
  }
  function fmtDate(s) {
    const [y,m,d] = s.split('-').map(Number);
    return `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}`;
  }
  function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  }
  function endOfDay(s) {
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d, 23, 59, 59, 999).getTime();
  }
  function uid() { return Math.random().toString(36).slice(2,10); }
  function fmtDur(ms) {
    if (ms < 0) ms = 0;
    const total = Math.floor(ms/1000);
    const h = Math.floor(total/3600);
    const m = Math.floor((total%3600)/60);
    const s = total%60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function plural(n, one, few, many) {
    const n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }
  function longDate(d) {
    d = d || new Date();
    const days = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
  }

  /* ============ STATE ============ */
  let state = null;
  const ui = { compose: null, stats: false, refocus: null };

  function defaultState() {
    return {
      version: VERSION,
      mode: 'soft',
      streak: 0,
      bestStreak: 0,
      totalClosed: 0,
      totalFailed: 0,
      tokens: 3,
      tokensMonth: dstr().slice(0,7),
      plan: null,
      draft: null,
      pendingFailure: null,
      history: [],
      lastEveningReminder: null
    };
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p.version === VERSION) return Object.assign(defaultState(), p);
      }
    } catch(e) {}
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
  }

  /* ============ RECONCILE ============ */
  function reconcile() {
    let changed = false;
    const t = dstr();
    const monthKey = t.slice(0,7);

    // Monthly token refresh
    if (state.tokensMonth !== monthKey) {
      state.tokensMonth = monthKey;
      state.tokens = 3;
      changed = true;
    }

    // Resolve stale pendingFailure (safety)
    if (state.pendingFailure && state.pendingFailure.plan.forDate < addDays(t, -3)) {
      state.pendingFailure = null;
      changed = true;
    }

    // Past plan
    if (state.plan && state.plan.forDate < t) {
      const p = state.plan;
      state.plan = null;
      if (p.status === 'active') {
        const remaining = p.tasks.filter(x => !x.done);
        if (remaining.length === 0) {
          p.status = 'closed';
          p.closedAt = p.closedAt || Date.now();
          state.streak++;
          if (state.streak > state.bestStreak) state.bestStreak = state.streak;
          state.totalClosed++;
        } else {
          p.status = 'failed';
          state.totalFailed++;
          state.streak = 0;
          state.pendingFailure = {
            plan: p,
            remaining: remaining.map(x => ({ text: x.text }))
          };
        }
      }
      state.history.unshift(p);
      changed = true;
    }

    // Lock draft if it's due
    if (state.draft && state.draft.forDate <= t && !state.plan) {
      state.plan = {
        forDate: state.draft.forDate,
        createdAt: Date.now(),
        tasks: state.draft.tasks.map(x => ({ id: uid(), text: x.text, done: false, carried: !!x.carried })),
        status: 'active',
        closedAt: null
      };
      state.draft = null;
      changed = true;
    }

    // Discard stale draft
    if (state.draft && state.draft.forDate < t) {
      state.draft = null;
      changed = true;
    }
    // Defensive: draft for today while plan already exists
    if (state.draft && state.plan && state.draft.forDate <= t) {
      state.draft = null;
      changed = true;
    }

    if (changed) save();
    return changed;
  }

  /* ============ ACTIONS ============ */
  function createPlan(forDate, tasks) {
    state.plan = {
      forDate,
      createdAt: Date.now(),
      tasks: tasks.map(t => ({ id: uid(), text: t.text, done: false, carried: !!t.carried })),
      status: 'active',
      closedAt: null
    };
    save();
  }

  function checkCompletion() {
    if (!state.plan || state.plan.status !== 'active') return;
    if (state.plan.tasks.length > 0 && state.plan.tasks.every(x => x.done)) {
      state.plan.status = 'closed';
      state.plan.closedAt = Date.now();
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      state.totalClosed++;
      save();
    }
  }

  function openCompose(forDate, isLate, initialTasks) {
    ui.compose = {
      forDate,
      isLate,
      tasks: (initialTasks || []).map(t => ({ text: t.text, carried: !!t.carried }))
    };
    render();
  }

  function resolveCarry() {
    const pf = state.pendingFailure;
    if (!pf) return;
    const isHard = state.mode === 'hard';
    if (isHard && state.tokens <= 0) return;
    if (isHard) state.tokens--;

    const carryTasks = pf.remaining;
    state.pendingFailure = null;

    const remainingMs = endOfDay(dstr()) - Date.now();

    // Too late for today — put into tomorrow's draft
    if (remainingMs < 60*60*1000) {
      const tomorrow = addDays(dstr(), 1);
      if (!state.draft || state.draft.forDate !== tomorrow) {
        state.draft = { forDate: tomorrow, tasks: [] };
      }
      for (const t of carryTasks) state.draft.tasks.push({ text: t.text, carried: true });
      save();
      render();
      return;
    }

    if (state.plan && state.plan.status === 'active') {
      for (const t of carryTasks) {
        state.plan.tasks.push({ id: uid(), text: t.text, done: false, carried: true });
      }
      save();
      render();
    } else {
      openCompose(dstr(), true, carryTasks.map(t => ({ text: t.text, carried: true })));
    }
  }

  function resetAll() {
    if (!confirm('Сбросить всё? Серия, история и планы будут удалены.')) return;
    state = defaultState();
    save();
    ui.compose = null;
    ui.stats = false;
    render();
  }

  /* ============ RENDER ============ */
  function render() {
    const app = $('#app');
    let html = renderHeader();
    if (state.pendingFailure) {
      html += renderFailure();
    } else if (state.plan && state.plan.status === 'active') {
      html += renderActive();
    } else if (state.plan && state.plan.status === 'closed') {
      html += renderClosed();
    } else {
      html += renderHome();
    }
    html += renderFooter();
    if (ui.compose) html += renderCompose();
    if (ui.stats) html += renderStats();
    app.innerHTML = html;

    if (ui.refocus) {
      const el = document.getElementById(ui.refocus);
      if (el) el.focus();
      ui.refocus = null;
    }
    tick();
  }

  function renderHeader() {
    return `
      <header class="hdr">
        <div class="brand">
          <div class="logo">▣</div>
          <div class="name">DayCloser</div>
        </div>
        <div class="hdr-stats">
          <button class="stat" data-action="stats" title="Статистика">
            <span class="ico">🔥</span><span class="val">${state.streak}</span>
          </button>
          <div class="stat" title="Токены переноса">
            <span class="ico">🎟</span><span class="val">${state.tokens}</span>
          </div>
        </div>
      </header>
    `;
  }

  function renderHome() {
    const tooLate = endOfDay(dstr()) - Date.now() < 60*60*1000;
    return `
      <main class="main">
        <div class="hero">
          <div class="hero-emoji">🌅</div>
          <h1>Сегодня ещё не начато</h1>
          <p class="muted">${longDate()}</p>
        </div>
        <div class="card">
          <p class="muted">Список блокируется: на сегодня — сразу, на завтра — в полночь. Дальше — 24 часа на выполнение.</p>
          ${tooLate ? `
            <p class="muted small" style="color:#fbbf24">До конца дня меньше часа. На сегодня уже поздно — планируй завтра.</p>
            <button class="btn primary" data-action="compose-tomorrow">План на завтра</button>
          ` : `
            <button class="btn primary" data-action="compose-today">План на сегодня <span class="muted small">(поздний старт)</span></button>
            <button class="btn" data-action="compose-tomorrow">План на завтра</button>
          `}
        </div>
        ${state.draft ? `
          <div class="card">
            <p class="muted small">План на завтра уже есть: ${state.draft.tasks.length} ${plural(state.draft.tasks.length,'задача','задачи','задач')}.</p>
            <button class="btn small" data-action="compose-tomorrow">Изменить</button>
          </div>
        ` : ''}
      </main>
    `;
  }

  function renderActive() {
    const p = state.plan;
    const total = p.tasks.length;
    const done = p.tasks.filter(t => t.done).length;
    const pct = total ? Math.round(done/total*100) : 0;
    return `
      <main class="main">
        <div class="card timer-card">
          <div class="timer-label">До закрытия дня</div>
          <div class="timer" id="timer">--:--:--</div>
          <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="muted">${done} из ${total} · план на ${fmtDate(p.forDate)}</div>
        </div>
        <div class="card">
          <ul class="tasks">
            ${p.tasks.map(t => `
              <li class="task ${t.done ? 'done' : ''}">
                <button class="check" data-action="toggle" data-id="${t.id}">${t.done ? '✓' : ''}</button>
                <span class="task-text">${esc(t.text)}</span>
                ${t.carried ? '<span class="badge">перенос</span>' : ''}
              </li>
            `).join('')}
          </ul>
        </div>
        <p class="muted center small">Список заблокирован. Выполни всё — и день закроется.</p>
      </main>
    `;
  }

  function renderClosed() {
    const p = state.plan;
    const tomorrow = addDays(p.forDate, 1);
    const doneCount = p.tasks.filter(t => t.done).length;
    return `
      <main class="main">
        <div class="card celebrate">
          <div class="big-emoji">🏆</div>
          <h1>День закрыт</h1>
          <p class="muted">${doneCount} ${plural(doneCount,'задача выполнена','задачи выполнены','задач выполнено')} · в ${fmtTime(p.closedAt)}</p>
        </div>
        <div class="card">
          <h2>План на завтра · ${fmtDate(tomorrow)}</h2>
          ${state.draft ? `
            <p class="muted">${state.draft.tasks.length} ${plural(state.draft.tasks.length,'задача','задачи','задач')} запланировано. В полночь список заблокируется.</p>
            <ul class="tasks compact">
              ${state.draft.tasks.map(t => `
                <li class="task">
                  <span class="task-text">${esc(t.text)}</span>
                  ${t.carried ? '<span class="badge">перенос</span>' : ''}
                </li>
              `).join('')}
            </ul>
            <button class="btn" data-action="compose-tomorrow">Изменить план</button>
          ` : `
            <p class="muted">Напиши список на завтра. В полночь он заблокируется, и начнётся отсчёт 24 часов.</p>
            <button class="btn primary" data-action="compose-tomorrow">Написать план на завтра</button>
          `}
        </div>
        <div class="card" style="text-align:center">
          <p class="muted small">Свободен до полуночи</p>
          <div class="timer-small" id="free-timer">--:--:--</div>
        </div>
      </main>
    `;
  }

  function renderFailure() {
    const pf = state.pendingFailure;
    const isHard = state.mode === 'hard';
    const canCarry = !isHard || state.tokens > 0;
    return `
      <main class="main">
        <div class="card fail">
          <div class="big-emoji">💀</div>
          <h1>День не закрыт</h1>
          <p class="muted">${pf.remaining.length} ${plural(pf.remaining.length,'задача не выполнена','задачи не выполнены','задач не выполнено')}. Серия сброшена.</p>
        </div>
        <div class="card">
          <h2>Незакрытые задачи</h2>
          <ul class="tasks compact">
            ${pf.remaining.map(t => `<li class="task"><span class="task-text">${esc(t.text)}</span></li>`).join('')}
          </ul>
        </div>
        <div class="card">
          <p class="muted">${isHard ? 'Перенос стоит 1 токен.' : 'В мягком режиме перенос бесплатный.'}</p>
          <button class="btn primary" data-action="resolve-carry" ${canCarry ? '' : 'disabled'}>
            Перенести ${isHard ? `(1 токен · осталось ${state.tokens})` : '(бесплатно)'}
          </button>
          <button class="btn" data-action="resolve-drop">Принять поражение</button>
        </div>
      </main>
    `;
  }

  function renderCompose() {
    const c = ui.compose;
    const isLate = c.isLate;
    return `
      <div class="overlay" data-action="overlay">
        <div class="modal">
          <h2>${isLate ? 'План на сегодня' : 'План на завтра'}</h2>
          <p class="muted small">${fmtDate(c.forDate)} · ${isLate ? 'После подтверждения список заблокируется.' : 'Можно менять до полуночи.'}</p>
          <ul class="tasks" style="margin-top:14px">
            ${c.tasks.length ? c.tasks.map((t,i) => `
              <li class="task">
                <span class="task-text">${esc(t.text)}</span>
                ${t.carried ? '<span class="badge">перенос</span>' : ''}
                <button class="icon-btn" data-action="compose-remove" data-i="${i}">✕</button>
              </li>
            `).join('') : '<li class="muted small" style="padding:8px 0">Пока пусто</li>'}
          </ul>
          <form data-action="compose-add">
            <div class="form-row">
              <input id="compose-input" placeholder="Что сделать?" maxlength="80" autocomplete="off">
              <button type="submit" class="btn small primary">+</button>
            </div>
          </form>
          <p class="muted small" style="margin-top:8px">${c.tasks.length}/${MAX_TASKS} задач</p>
          <div class="modal-actions">
            <button class="btn" data-action="compose-cancel">Отмена</button>
            <button class="btn primary" data-action="compose-done" ${c.tasks.length === 0 ? 'disabled' : ''}>
              ${isLate ? 'Заблокировать' : 'Сохранить'}
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function renderStats() {
    const h = state.history.slice(0, 30);
    return `
      <div class="overlay" data-action="overlay">
        <div class="modal">
          <h2>Статистика</h2>
          <div class="stat-grid">
            <div><div class="stat-num">${state.streak}</div><div class="muted small">серия</div></div>
            <div><div class="stat-num">${state.bestStreak}</div><div class="muted small">рекорд</div></div>
            <div><div class="stat-num">${state.totalClosed}</div><div class="muted small">закрыто</div></div>
            <div><div class="stat-num">${state.totalFailed}</div><div class="muted small">провалено</div></div>
          </div>

          <h2 style="margin-top:18px">Режим</h2>
          <div class="mode-row">
            <button class="btn ${state.mode === 'soft' ? 'primary' : ''}" data-action="set-mode" data-mode="soft">Мягкий</button>
            <button class="btn ${state.mode === 'hard' ? 'primary' : ''}" data-action="set-mode" data-mode="hard">Жёсткий</button>
          </div>
          <p class="muted small">Мягкий: незакрытые задачи переносятся бесплатно. Жёсткий: перенос стоит 1 токен, иначе задачи теряются. Токенов: ${state.tokens}/3 в месяц.</p>

          <h2 style="margin-top:18px">История</h2>
          ${h.length ? `<ul class="history">${h.map(p => `
            <li class="hist-row">
              <span class="hist-date">${fmtDate(p.forDate)}</span>
              <span class="hist-status ${p.status}">${p.status === 'closed' ? '✓ закрыт' : '✕ провален'}</span>
              <span class="muted small">${p.tasks.filter(t=>t.done).length}/${p.tasks.length}</span>
            </li>
          `).join('')}</ul>` : '<p class="muted small">Пока пусто</p>'}

          <div class="modal-actions">
            <button class="btn" data-action="reset">Сбросить всё</button>
            <button class="btn primary" data-action="stats-close">Закрыть</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderFooter() {
    return `<div class="footer">Закрой свой день. ${new Date().getFullYear()}</div>`;
  }

  /* ============ TICK & NOTIFICATIONS ============ */
  function tick() {
    const t1 = document.getElementById('timer');
    if (t1 && state.plan && state.plan.status === 'active') {
      t1.textContent = fmtDur(endOfDay(state.plan.forDate) - Date.now());
    }
    const t2 = document.getElementById('free-timer');
    if (t2 && state.plan && state.plan.status === 'closed') {
      t2.textContent = fmtDur(endOfDay(state.plan.forDate) + 1 - Date.now());
    }
  }

  function requestNotifPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      Notification.requestPermission().catch(()=>{});
    }
  }
  function notify(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try { new Notification(title, { body }); } catch(e) {}
  }
  function checkNotifs() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const t = dstr();
    const now = Date.now();

    // 1-hour warning
    if (state.plan && state.plan.status === 'active' && !state.plan.warned1h) {
      const rem = endOfDay(state.plan.forDate) - now;
      if (rem > 0 && rem < 60*60*1000) {
        state.plan.warned1h = true;
        notify('Остался 1 час', 'До закрытия дня — меньше часа.');
        save();
      }
    }
    // Evening reminder 21:00 if day closed but no draft
    if (state.plan && state.plan.status === 'closed' && !state.draft) {
      if (new Date().getHours() === 21 && state.lastEveningReminder !== t) {
        state.lastEveningReminder = t;
        notify('Пора планировать завтра', 'Напиши список, пока не наступила полночь.');
        save();
      }
    }
  }

  /* ============ EVENTS ============ */
  document.addEventListener('click', function(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;

    if (action === 'overlay') {
      if (e.target.closest('.modal')) return;
      ui.compose = null;
      ui.stats = false;
      render();
      return;
    }

    switch (action) {
      case 'stats':
        ui.stats = true;
        render();
        break;
      case 'stats-close':
        ui.stats = false;
        render();
        break;
      case 'set-mode':
        state.mode = el.dataset.mode;
        save();
        render();
        break;
      case 'reset':
        resetAll();
        break;
      case 'compose-today':
        openCompose(dstr(), true, []);
        break;
      case 'compose-tomorrow': {
        const tomorrow = addDays(dstr(), 1);
        const existing = (state.draft && state.draft.forDate === tomorrow) ? state.draft.tasks : [];
        openCompose(tomorrow, false, existing);
        break;
      }
      case 'compose-cancel':
        ui.compose = null;
        render();
        break;
      case 'compose-remove':
        if (!ui.compose) break;
        ui.compose.tasks.splice(+el.dataset.i, 1);
        render();
        break;
      case 'compose-done': {
        if (!ui.compose || ui.compose.tasks.length === 0) break;
        const c = ui.compose;
        if (c.isLate) {
          createPlan(c.forDate, c.tasks);
          ui.compose = null;
          render();
        } else {
          state.draft = {
            forDate: c.forDate,
            tasks: c.tasks.map(t => ({ text: t.text, carried: !!t.carried }))
          };
          ui.compose = null;
          save();
          render();
        }
        break;
      }
      case 'toggle': {
        if (!state.plan) break;
        const t = state.plan.tasks.find(x => x.id === el.dataset.id);
        if (!t) break;
        t.done = !t.done;
        checkCompletion();
        save();
        render();
        break;
      }
      case 'resolve-carry':
        resolveCarry();
        break;
      case 'resolve-drop':
        state.pendingFailure = null;
        save();
        render();
        break;
    }
  });

  document.addEventListener('submit', function(e) {
    const form = e.target.closest('[data-action]');
    if (!form) return;
    e.preventDefault();
    const action = form.dataset.action;

    if (action === 'compose-add') {
      const input = document.getElementById('compose-input');
      if (!input || !ui.compose) return;
      const text = input.value.trim();
      if (!text || ui.compose.tasks.length >= MAX_TASKS) return;
      ui.compose.tasks.push({ text, carried: false });
      input.value = '';
      ui.refocus = 'compose-input';
      render();
    }
  });

  /* ============ INIT ============ */
  function init() {
    state = load();
    reconcile();
    render();

    setInterval(tick, 1000);
    setInterval(function() {
      const changed = reconcile();
      checkNotifs();
      if (changed) render();
    }, 5000);

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) { reconcile(); render(); }
    });

    // Ask notifications on first interaction
    document.addEventListener('click', requestNotifPermission, { once: true });
  }

  init();
})();
</script>
</body>
</html>
